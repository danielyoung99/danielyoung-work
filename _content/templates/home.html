<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Young</title>
<meta name="description" content="Daniel Young is a senior designer building brands that work for people, and for AI. Head of Design at DHD, Northern Ireland.">
<style>
@font-face{font-family:"Timeless Sans";src:url(/fonts/TimelessSansVF.woff2) format("woff2");font-weight:300 800;font-style:normal;font-display:swap}

:root{
  --bg:#dfdfd8;
  --block:#d5d5cd;
  --ink:#0a0a0a;
  --mute:#8c8c85;
  
  --sans:"Timeless Sans",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --gut:clamp(20px,3.4vw,44px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121211;--block:#1c1c1a;--ink:#f1f1ec;--mute:#85857e}
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid currentColor;outline-offset:4px}

.wrap{max-width:1512px;margin:0 auto;padding:0 var(--gut)}

/* header */
.top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding-top:clamp(18px,2.6vw,32px);
  color:var(--mute);
  font-size:15px;
}
.top nav{display:flex;gap:clamp(16px,2.4vw,32px)}
.top a{transition:color .15s}
.top a:hover{color:var(--ink)}

/* hero */
.hero{padding:clamp(56px,10vw,128px) 0 clamp(64px,9vw,128px)}
h1{
  font-weight:500;
  font-size:clamp(32px,5vw,76px);
  line-height:1.08;
  letter-spacing:-.025em;
  max-width:15em;
  text-wrap:balance;
}

/* work: each case study is a landscape (2160x1350) and a portrait (1080x1350), rounded, in five arrangements */
:root{--r:clamp(6px,.7vw,10px)}
.work{display:flex;flex-direction:column;gap:clamp(80px,11vw,170px)}
.work-item{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  column-gap:clamp(12px,2.6vw,40px);
  align-items:start;
  width:100%;
}
.pair{display:contents}
.ph{overflow:hidden;background:var(--block);border-radius:var(--r)}
.ph img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.ph.l{aspect-ratio:2160/1350}
.ph.p{aspect-ratio:1080/1350}
.work-item:hover .ph img{transform:scale(1.03)}
.cap{margin-top:20px;max-width:28em}
.cap .eyebrow{font-size:17px;font-weight:500;line-height:1.3}
.cap .line{margin-top:4px;color:var(--mute);font-size:17px;line-height:1.4;text-wrap:pretty}

/* a: landscape left, portrait right, same height */
.v-a{grid-template-columns:2fr 1fr}
.v-a .l{grid-column:1;grid-row:1}
.v-a .p{grid-column:2;grid-row:1}
.v-a .cap{grid-column:1;grid-row:2}
/* b: tall portrait left, landscape right, caption under the landscape */
.v-b .p{grid-column:1 / span 5;grid-row:1 / span 2}
.v-b .l{grid-column:6 / span 7;grid-row:1}
.v-b .cap{grid-column:6 / span 7;grid-row:2}
/* c: small portrait top left, large landscape right, caption centred below */
.v-c .p{grid-column:1 / span 3;grid-row:1}
.v-c .l{grid-column:4 / span 9;grid-row:1}
.v-c .cap{grid-column:4 / span 9;grid-row:2}
/* d: large landscape left, small portrait right dropped lower */
.v-d .l{grid-column:1 / span 9;grid-row:1}
.v-d .p{grid-column:10 / span 3;grid-row:1 / span 2;margin-top:clamp(0px,9vw,140px)}
.v-d .cap{grid-column:1 / span 6;grid-row:2}
/* e: landscape left, taller portrait right overlapping the caption row */
.v-e .l{grid-column:1 / span 7;grid-row:1}
.v-e .p{grid-column:8 / span 4;grid-row:1 / span 2;margin-top:clamp(0px,6vw,96px)}
.v-e .cap{grid-column:1 / span 6;grid-row:2}

@media (max-width:760px){
  /* phones: a touch more air and a slightly larger headline so the hero feels as roomy as on desktop */
  .top{padding-top:28px}
  .hero{padding:clamp(88px,26vw,120px) 0 clamp(88px,26vw,120px)}
  h1{font-size:clamp(35px,9.6vw,44px);line-height:1.1}
  /* phones: landscape image only, caption underneath; the portrait is hidden */
  .work-item{grid-template-columns:1fr;row-gap:0}
  .work-item .l{grid-column:1;grid-row:1;margin-top:0}
  .work-item .p{display:none}
  .work-item .cap{grid-column:1;grid-row:2;margin-top:20px;max-width:none}
}

/* from the notes and the Lab: soft text cards, nothing like the work grid above */
:root{--rule:color-mix(in srgb,var(--mute),transparent 55%);--cr:calc(var(--r)*1.8)}
.band{margin-top:clamp(96px,12vw,176px)}
.band-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:clamp(20px,2.4vw,32px)}
.band-head h2{font-weight:500;font-size:17px;line-height:1.2;color:var(--mute)}
.band-head a{font-size:17px;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:2px;white-space:nowrap;transition:color .15s}
.band-head a:hover{color:var(--mute)}
.cards{display:grid;gap:clamp(12px,1.6vw,20px)}
.cards.n{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards.l{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{display:flex;flex-direction:column;border-radius:var(--cr);padding:clamp(20px,2vw,28px);transition:background .2s,border-color .2s}
.card h3{font-weight:500;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.card p{margin-top:12px;color:var(--mute);font-size:16px;line-height:1.4;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard{background:var(--block);min-height:clamp(280px,26vw,360px)}
.ncard:hover{background:color-mix(in srgb,var(--block),var(--ink) 7%)}
.ncard .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:15px}
.ncard .meta b{color:var(--ink);font-weight:500}
.ncard h3{margin-top:clamp(28px,4vw,56px);font-size:clamp(22px,2.2vw,30px)}
.ncard .len{margin-top:auto;padding-top:20px;color:var(--mute);font-size:15px}
.lcard{border:1px solid var(--rule);min-height:clamp(200px,17vw,240px)}
.lcard:hover{border-color:var(--ink)}
.lcard .kind{color:var(--mute);font-size:15px;line-height:1.3}
.lcard h3{margin-top:clamp(20px,2.6vw,36px);font-size:clamp(22px,2vw,26px)}
.lcard .built{margin-top:auto;padding-top:16px;color:var(--mute);font-size:14px}
@media (max-width:1000px){
  .cards.n{grid-template-columns:1fr}
  .ncard{min-height:0}
  .ncard .len{padding-top:14px;margin-top:0}
  .cards.l{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .cards.l{grid-template-columns:1fr}
  .lcard{min-height:0}
  .lcard .built{padding-top:12px;margin-top:0}
}

.foot{
  margin-top:clamp(96px,12vw,176px);
  padding-bottom:40px;
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;
  color:var(--mute);
  font-size:15px;
}
.foot .links{display:flex;flex-wrap:wrap;gap:8px 24px}
.foot a:hover{color:var(--ink)}
@media (max-width:760px){
  .foot{flex-direction:column;gap:12px}
}

@media (prefers-reduced-motion:no-preference){
  .js .rv{opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
  .js .rv.on{opacity:1;transform:none}
}
</style>
<link rel="stylesheet" href="/assets/nav.css">
<script src="/assets/nav.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a href="/" aria-label="Daniel Young, home">Daniel Young</a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="/lab/">Lab</a>
      <a href="/about/">About</a>
      <a href="/notes/">Notes</a>
      <a href="/contact/">Contact</a>
    </nav>
  </header>

  <section class="hero" id="top">
    <h1 class="rv">{{HERO}}</h1>
  </section>

  <section class="work" id="work" aria-label="Selected work">
{{WORK}}
  </section>

  <section class="band" aria-label="From the notes">
    <div class="band-head rv"><h2>From the notes</h2><a href="/notes/">All notes &rarr;</a></div>
    <div class="cards n">
{{NOTES}}
    </div>
  </section>

  <section class="band" aria-label="From the Lab">
    <div class="band-head rv"><h2>From the Lab</h2><a href="/lab/">Everything in the Lab &rarr;</a></div>
    <div class="cards l">
{{LABCARDS}}
    </div>
  </section>

  <footer class="foot">
    <a href="mailto:info@danielyoung.work">info@danielyoung.work</a>
    <div class="links" aria-label="Social">
      <a href="https://www.linkedin.com/in/daniel-young/" rel="me noopener" target="_blank">LinkedIn</a>
      <a href="https://www.instagram.com/danielyoung.work/" rel="me noopener" target="_blank">Instagram</a>
      <a href="https://x.com/danielyoungwork" rel="me noopener" target="_blank">X</a>
    </div>
    <div class="links"><a href="/work/">All work</a></div>
  </footer>

</div>
<script>
(function(){
  // On the home page the name link goes to the very top of the page, not to the hero below the header
  var home=document.querySelector('.top > a');
  if(home)home.addEventListener('click',function(e){
    if(location.pathname!=='/')return;
    e.preventDefault();
    window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  });
})();
(function(){
  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.documentElement.classList.add('js');
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.05});
  els.forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
