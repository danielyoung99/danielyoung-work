<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/wipe.js"></script>
<title>Contact · Daniel Young</title>
<meta name="description" content="Get in touch with Daniel Young about a brand, a website or a product.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts.css?v=1">
<link rel="stylesheet" href="/site.css?v=2">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script defer src="/site.js?v=2"></script>
<script defer src="/nav.js"></script>
</head>
<body>
<main class="page">
  <header class="wrap pagehead">
    <p class="kicker" data-fade>Contact</p>
    <h1 class="big" data-rise style="margin-top:24px">Tell me what <em>you have in mind.</em></h1>
  </header>

  <section class="section wrap">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:24px">
      <a class="mail link" href="mailto:info@danielyoung.work">info@danielyoung.work</a>
      <button class="copy" type="button" data-copy="info@danielyoung.work">Copy</button>
    </div>
    <p class="cap" style="margin-top:0">Or pick what you need below and I'll write the start of the email for you.</p>

    <form class="pick" data-pick onsubmit="return false">
      <div class="field">
        <p class="label">What do you need</p>
        <div class="chips">
          <button class="chip" type="button" aria-pressed="false">Brand identity</button>
          <button class="chip" type="button" aria-pressed="false">Brand strategy</button>
          <button class="chip" type="button" aria-pressed="false">Naming</button>
          <button class="chip" type="button" aria-pressed="false">Art direction</button>
          <button class="chip" type="button" aria-pressed="false">Illustration</button>
          <button class="chip" type="button" aria-pressed="false">Website</button>
          <button class="chip" type="button" aria-pressed="false">Product</button>
          <button class="chip" type="button" aria-pressed="false">Copywriting</button>
        </div>
      </div>
      <div class="field"><input type="text" name="name" autocomplete="name" placeholder="Your name" aria-label="Your name"></div>
      <div class="field"><textarea name="message" placeholder="A few lines about the project" aria-label="About the project"></textarea></div>
      <div><a class="btn" data-go href="mailto:info@danielyoung.work" data-magnetic>Open in your email app <i>&rarr;</i></a></div>
      <p class="cap" style="margin:0">This opens your own email app with the message ready to send. Nothing is sent from this page.</p>
    </form>
  </section>
</main>
</body>
</html>
